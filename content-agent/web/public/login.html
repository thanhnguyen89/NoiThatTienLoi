<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Content Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <span class="logo-icon">🤖</span>
        <h1>Content Agent</h1>
        <p>Forme Marketing System</p>
      </div>
      
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" name="username" placeholder="admin" autofocus required>
        </div>
        
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" placeholder="••••••" required>
        </div>
        
        <div id="error-message" class="error-message hidden"></div>
        
        <button type="submit" class="btn-login" id="btn-login">
          🔑 Đăng nhập
        </button>
      </form>
      
      <div class="login-footer">
        <small>Mặc định: admin / admin123</small>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-message');
    const btnLogin = document.getElementById('btn-login');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError('Vui lòng nhập đầy đủ thông tin');
        return;
      }
      
      btnLogin.disabled = true;
      btnLogin.textContent = '⏳ Đang đăng nhập...';
      errorEl.classList.add('hidden');
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (!res.ok || !data.success) {
          showError(data.error || 'Lỗi đăng nhập');
          btnLogin.disabled = false;
          btnLogin.textContent = '🔑 Đăng nhập';
          return;
        }
        
        // Lưu token vào localStorage (backup)
        localStorage.setItem('ca_token', data.data.token);
        localStorage.setItem('ca_user', JSON.stringify(data.data));
        
        // Redirect về trang chính
        window.location.href = '/';
        
      } catch (error) {
        console.error('Login error:', error);
        showError('Lỗi kết nối server');
        btnLogin.disabled = false;
        btnLogin.textContent = '🔑 Đăng nhập';
      }
    });
    
    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }
    
    // Nếu đã login rồi thì redirect
    (async () => {
      try {
        const token = localStorage.getItem('ca_token');
        if (!token) return;
        
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (res.ok) {
          window.location.href = '/';
        }
      } catch (e) {
        // Ignore
      }
    })();
  </script>
</body>
</html>
