<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Content Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1F7A5C 0%, #2E8B6E 50%, #3A9D7C 100%);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 0 16px;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 36px;
    }

    .logo-title {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .logo-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      margin: 0;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .card-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .error-message.show {
      display: flex;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 15px;
    }

    .form-input {
      width: 100%;
      padding: 11px 12px 11px 36px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .form-input:focus {
      border-color: #1F7A5C;
    }

    .password-input {
      padding-right: 40px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      padding: 0;
      font-size: 15px;
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 13px;
      color: #1976d2;
      text-decoration: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #1F7A5C;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .submit-btn:hover {
      background: #1a6b4f;
    }

    .submit-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      text-decoration: none;
    }

    .back-link a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-icon">🤖</div>
      <h1 class="logo-title">Content Agent</h1>
      <p class="logo-subtitle">Hệ thống tạo nội dung tự động</p>
    </div>

    <!-- Card -->
    <div class="login-card">
      <h2 class="card-title">Đăng nhập</h2>
      <p class="card-subtitle">Vui lòng nhập thông tin để tiếp tục</p>

      <div id="error-message" class="error-message">
        <span>⚠️</span>
        <span id="error-text"></span>
      </div>

      <form id="login-form" novalidate>
        <!-- Username -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="Tên đăng nhập"
              autocomplete="username"
              autofocus
              required
            >
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input password-input"
              placeholder="Mật khẩu"
              autocomplete="current-password"
              required
            >
            <button type="button" id="toggle-password" class="toggle-password">
              👁️
            </button>
          </div>
        </div>

        <!-- Remember & Forgot -->
        <div class="form-footer">
          <label class="remember-label">
            <input type="checkbox" id="remember"> Ghi nhớ đăng nhập
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn" class="submit-btn">
          <span>🚀</span>
          <span>Đăng nhập</span>
        </button>
      </form>
    </div>

    <!-- Back link -->
    <div class="back-link">
      <a href="/">
        ← Quay lại trang chủ
      </a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const submitBtn = document.getElementById('submit-btn');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePasswordBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // Clear error on input
    [usernameInput, passwordInput].forEach(input => {
      input.addEventListener('input', () => {
        errorMessage.classList.remove('show');
      });
    });

    // Handle form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('Vui lòng nhập username và mật khẩu');
        return;
      }

      setLoading(true);
      errorMessage.classList.remove('show');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Đăng nhập thất bại');
          return;
        }

        // Save token
        localStorage.setItem('ca_token', data.token);
        if (data.user) {
          localStorage.setItem('ca_user', JSON.stringify(data.user));
        }

        // Show success message briefly
        submitBtn.innerHTML = '<span>✅</span><span>Đăng nhập thành công!</span>';
        submitBtn.style.background = '#4caf50';
        
        // Redirect to main app
        setTimeout(() => {
          window.location.href = '/';
        }, 500);
      } catch (error) {
        console.error('Login error:', error);
        showError('Lỗi kết nối: ' + error.message);
      } finally {
        setLoading(false);
      }
    });

    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.add('show');
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      if (loading) {
        submitBtn.innerHTML = '<span class="spinner"></span><span>Đang đăng nhập...</span>';
      } else {
        submitBtn.innerHTML = '<span>🚀</span><span>Đăng nhập</span>';
      }
    }

    // Check if already logged in
    const token = localStorage.getItem('ca_token');
    if (token) {
      // Verify token is still valid
      fetch('/api/auth/me', {
        headers: { 'Authorization': `Bearer ${token}` }
      })
      .then(res => {
        if (res.ok) {
          window.location.href = '/';
        } else {
          localStorage.removeItem('ca_token');
          localStorage.removeItem('ca_user');
        }
      })
      .catch(() => {
        localStorage.removeItem('ca_token');
        localStorage.removeItem('ca_user');
      });
    }
  </script>
</body>
</html>
